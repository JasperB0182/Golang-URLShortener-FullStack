<form class="Login" (ngSubmit)="login()">
  <h1>Login</h1>
  <input type="text" placeholder="Email" [(ngModel)]="Email" name="email pls">
  <input type="password" placeholder="Wachtwoord" [(ngModel)]="Password" name="wachtwoord pls">
  <button type="submit">Login</button>
  <p>{{SuccessLogin}}</p>
  <p>{{ErrorLogin}}</p>
</form>
