<form class="Login" (ngSubmit)="login()">
  <h1>Login</h1>
  <input type="text" placeholder="Email" [(ngModel)]="Email" name="email">
  <input type="password" placeholder="Wachtwoord" [(ngModel)]="Password" name="wachtwoord">
  <button type="submit">Login</button>
  <p class="SuccessLogin">{{SuccessLogin}}</p>
  <p class="ErrorLogin">{{ErrorLogin}}</p>
</form>
