<form class="Login" (ngSubmit)="register()">
  <h1>Register</h1>
  <input type="text" placeholder="Name" [(ngModel)]="Name" name="Name">
  <input type="text" placeholder="Email" [(ngModel)]="Email" name="email">
  <input type="password" placeholder="Wachtwoord" [(ngModel)]="Password" name="wachtwoord">
  <button type="submit">Register</button>
  <p>{{SuccessLogin}}</p>
  <p>{{ErrorLogin}}</p>
</form>
